<app-breadcrumb-inline [segments]="breadcrumb" />
<app-page-toolbar>
  <h1 data-toolbar-title class="text-title-sm font-semibold text-gray-800 dark:text-white/90">Resúmenes SUNAT</h1>
</app-page-toolbar>

<app-component-card title="Resumen diario de boletas (RC)" className="mt-4">
  <p class="mb-4 text-sm text-gray-600 dark:text-gray-400">
    Envía el resumen diario de boletas aceptadas al OSE/SUNAT para el día seleccionado.
  </p>
  <div class="flex max-w-md flex-wrap items-end gap-3">
    <app-input-field type="date" [value]="fecha()" (valueChange)="fecha.set('' + $event)" />
    <app-button variant="primary" [disabled]="summaryMutation.isPending()" (btnClick)="summaryMutation.mutate()">
      Enviar RC
    </app-button>
  </div>
  @if (lastResult(); as result) {
    <p class="mt-4 text-sm text-emerald-700 dark:text-emerald-300">{{ result.message }} · ID: {{ result.id }}</p>
  }
</app-component-card>
