<app-modal
  [isOpen]="isOpen()"
  (close)="onClose()"
  className="w-full max-w-lg shadow-theme-lg"
>
  <div
    data-modal-header
    class="shrink-0 border-b border-gray-100 px-4 py-4 dark:border-gray-800 sm:px-8 sm:py-5"
  >
    <div class="pr-12">
      <div class="flex items-center gap-2">
        <h3 class="text-xl font-semibold text-gray-800 dark:text-white/90">
          Convertir lead
        </h3>
        <app-help-hint
          text="Crea el cliente SaaS, un establecimiento inicial y el usuario administrador usando los datos del lead."
        />
      </div>
      @if (leadContact()) {
        <p class="mt-1 text-theme-sm text-gray-500 dark:text-gray-400">{{ leadContact() }}</p>
      }
    </div>
  </div>

  <div data-modal-body class="min-h-0 px-4 py-4 sm:px-8 sm:py-5">
    <p class="mb-4 text-theme-sm leading-relaxed text-gray-600 dark:text-gray-400">
      Se creará el cliente SaaS, un establecimiento inicial y el usuario administrador con los datos del lead.
    </p>

    <app-form-stack>
      <app-form-field
        label="Nombre del establecimiento"
        helpText="Nombre de la primera sede que se creará junto al cliente."
      >
        <app-input-field
          [value]="establishmentNombre()"
          (valueChange)="establishmentNombre.set('' + $event)"
        />
      </app-form-field>
    </app-form-stack>
  </div>

  <div
    data-modal-footer
    class="flex shrink-0 justify-end gap-3 border-t border-gray-100 px-4 py-4 dark:border-gray-800 sm:px-8 sm:py-4"
  >
    <app-button
      variant="outline"
      startIconName="mdi:close"
      [disabled]="convertMutation.isPending()"
      (btnClick)="onClose()"
    >
      Cancelar
    </app-button>
    <app-button
      startIconName="mdi:account-convert-outline"
      [disabled]="convertMutation.isPending()" [loading]="convertMutation.isPending()"
      (btnClick)="submit()"
    >
      {{ submitLabel() }}
    </app-button>
  </div>
</app-modal>
