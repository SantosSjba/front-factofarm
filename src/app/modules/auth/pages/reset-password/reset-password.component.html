<app-auth-page-layout>
  <div class="flex flex-col justify-center flex-1 w-full max-w-md mx-auto">
    <h1 class="mb-2 font-semibold text-gray-800 text-title-sm dark:text-white/90 sm:text-title-md">
      Nueva contraseña
    </h1>
    <p class="mb-6 text-sm text-gray-500 dark:text-gray-400">
      Elige una contraseña segura para tu cuenta FactoFarm.
    </p>

    <form class="space-y-5" (ngSubmit)="submit()">
      <div>
        <app-label>Nueva contraseña</app-label>
        <app-input-field
          type="password"
          [value]="password()"
          (valueChange)="password.set($event + '')"
          placeholder="Mínimo 8 caracteres"
          required
        />
      </div>
      <div>
        <app-label>Confirmar contraseña</app-label>
        <app-input-field
          type="password"
          [value]="password2()"
          (valueChange)="password2.set($event + '')"
          placeholder="Repita la contraseña"
          required
        />
      </div>
      @if (submitError()) {
        <div class="rounded-lg border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700 dark:border-rose-900 dark:bg-rose-900/20 dark:text-rose-200" role="alert">
          {{ submitError() }}
        </div>
      }
      <app-button
        className="w-full"
        size="sm"
        [disabled]="isLoading() || !token()"
        (btnClick)="submit()"
      >
        {{ isLoading() ? 'Guardando…' : 'Restablecer contraseña' }}
      </app-button>
    </form>

    <p class="mt-6 text-sm text-center text-gray-500">
      <a routerLink="/auth/signin" class="text-brand-500 hover:text-brand-600">Iniciar sesión</a>
    </p>
  </div>
</app-auth-page-layout>
