<button
  type="button"
  (click)="toggleTheme()"
  aria-label="Cambiar tema claro u oscuro"
  class="relative inline-flex size-10 lg:size-11 shrink-0 items-center justify-center rounded-[10px] border border-gray-300 bg-transparent text-gray-500 shadow-theme-xs transition-all hover:bg-gray-50 hover:text-gray-800 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-gray-700/50 dark:hover:text-white"
>
  @if ((theme$ | async) === 'dark') {
    <app-icon name="lucide:sun" width="20" height="20" />
  } @else {
    <app-icon name="lucide:moon" width="20" height="20" />
  }
</button>
