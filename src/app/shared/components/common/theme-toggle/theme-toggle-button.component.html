<button
  type="button"
  (click)="toggleTheme()"
  aria-label="Cambiar tema claro u oscuro"
  class="relative flex h-9 w-9 items-center justify-center rounded-lg border border-gray-200 bg-white text-gray-500 transition hover:bg-gray-50 hover:text-gray-700 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white"
>
  @if ((theme$ | async) === 'dark') {
    <app-icon name="lucide:sun" width="20" height="20" />
  } @else {
    <app-icon name="lucide:moon" width="20" height="20" />
  }
</button>
