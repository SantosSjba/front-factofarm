<button
  type="button"
  (click)="toggleTheme()"
  aria-label="Cambiar tema claro u oscuro"
  class="inline-flex items-center justify-center text-white transition-colors rounded-full size-14 bg-brand-500 hover:bg-brand-600"
>
  @if ((theme$ | async) === 'dark') {
    <app-icon name="lucide:sun" width="20" height="20" />
  } @else {
    <app-icon name="lucide:moon" width="20" height="20" />
  }
</button>
