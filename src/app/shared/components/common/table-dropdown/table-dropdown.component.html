<div>
  <div #buttonRef (click)="toggle()" role="button" tabindex="0" (keydown.enter)="onTriggerKey($event)" (keydown.space)="onTriggerKey($event)">
    <ng-content select="[dropdown-button]"></ng-content>
  </div>
  <div class="z-[999]" #contentRef>
    <div 
      [ngStyle]="{ display: isOpen ? 'block' : 'none' }" 
      class="flex w-44 flex-col gap-1 rounded-2xl border border-gray-200 bg-white p-3 shadow-theme-lg dark:border-gray-800 dark:bg-gray-dark"
      role="menu"
      aria-orientation="vertical"
      aria-labelledby="options-menu"
    >
      <div class="space-y-1">
        <ng-content select="[dropdown-content]"></ng-content>
      </div>
    </div>
  </div>
</div>
