<div>
  <div #buttonRef>
    <ng-content select="[dropdown-button]"></ng-content>
  </div>
  <!-- popover="auto": capa superior, Esc y clic fuera nativos. Popper fija la posición. -->
  <div
    #contentRef
    popover="auto"
    [id]="menuId"
    class="ff-menu-popover inset-auto m-0 overflow-visible border-0 bg-transparent p-0 text-inherit"
  >
    <div
      #menuRef
      class="flex w-max min-w-52 max-w-72 flex-col gap-1 rounded-2xl border border-gray-200 bg-white p-3 shadow-theme-lg dark:border-gray-800 dark:bg-gray-dark"
      aria-orientation="vertical"
    >
      <div class="space-y-1">
        <ng-content select="[dropdown-content]"></ng-content>
      </div>
    </div>
  </div>
</div>
