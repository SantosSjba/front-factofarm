<div class="h-full rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03] {{ className }}">
  <!-- Card Header: se omite sin título (p. ej. la tabla principal, cuando el título ya está en la barra de la página). -->
  @if (title || desc) {
  <div class="flex flex-wrap items-center justify-between gap-x-6 gap-y-2" [class]="compact ? 'px-4 py-3' : 'px-6 py-5'">
    <div class="flex min-w-0 items-center gap-2.5">
      @if (icon) {
        <!-- Ícono de la sección, con el mismo estilo que los KPI del dashboard. -->
        <span class="flex shrink-0 items-center justify-center rounded-lg bg-brand-50 text-brand-600 dark:bg-brand-500/10 dark:text-brand-400" [class]="compact ? 'size-8' : 'size-9'">
          <app-icon [name]="icon" [iconClass]="compact ? 'size-4' : 'size-5'" />
        </span>
      }
      <div class="min-w-0">
        <div class="flex items-center gap-1.5">
          <h3 class="font-medium text-gray-800 dark:text-white/90" [class]="compact ? 'text-sm' : 'text-base'">
            {{ title }}
          </h3>
          @if (helpText) {
            <app-help-hint [text]="helpText" [iconSize]="compact ? 14 : 15" />
          }
        </div>
        @if (desc) {
          <p class="text-gray-500 dark:text-gray-400" [class]="compact ? 'mt-0.5 text-theme-xs' : 'mt-1 text-sm'">
            {{ desc }}
          </p>
        }
      </div>
    </div>
    <!-- Contenido al lado del título: leyendas, resúmenes… -->
    <ng-content select="[data-card-header-end]"></ng-content>
  </div>
  }

  <!-- Card Body -->
  <div
    [class.border-t]="!!(title || desc)"
    class="border-gray-100 dark:border-gray-800"
    [ngClass]="bodyClass !== '' ? bodyClass : compact ? 'p-4' : 'p-4 sm:p-6'"
  >
    <app-page-state
      [loading]="loading"
      [error]="error"
      [empty]="empty"
      [loadingLabel]="loadingLabel"
      [errorTitle]="errorTitle"
      [emptyTitle]="emptyTitle"
      [emptyHint]="emptyHint"
      [showRetry]="showRetry"
      [skeleton]="skeleton"
      [skeletonCount]="skeletonCount"
      (retry)="retry.emit()"
    >
      <div [class]="compact ? 'space-y-4' : 'space-y-6'">
        <ng-content></ng-content>
      </div>
    </app-page-state>
  </div>
</div>
