<div class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03] {{ className }}">
  <!-- Card Header -->
  <div class="px-4 py-2.5 sm:px-5 sm:py-3">
    <div class="flex items-center gap-1.5">
      <h3 class="text-sm font-semibold text-gray-800 dark:text-white/90">
        {{ title }}
      </h3>
      @if (helpText) {
        <app-help-hint [text]="helpText" [iconSize]="15" />
      }
    </div>
    @if (desc) {
      <p class="mt-0.5 text-theme-xs text-gray-500 dark:text-gray-400">
        {{ desc }}
      </p>
    }
  </div>

  <!-- Card Body -->
  <div
    class="border-t border-gray-100 dark:border-gray-800"
    [ngClass]="bodyClass !== '' ? bodyClass : 'p-3 sm:p-4'"
  >
    <app-page-state
      [loading]="loading"
      [error]="error"
      [empty]="empty"
      [loadingLabel]="loadingLabel"
      [errorTitle]="errorTitle"
      [emptyTitle]="emptyTitle"
      [emptyHint]="emptyHint"
      [showRetry]="showRetry"
      [skeleton]="skeleton"
      [skeletonCount]="skeletonCount"
      (retry)="retry.emit()"
    >
      <div class="space-y-4">
        <ng-content></ng-content>
      </div>
    </app-page-state>
  </div>
</div>
