<div class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03]" [class]="compact ? 'mb-4 p-3' : 'mb-5 p-4'">
  @if (collapsible) {
    <div class="flex flex-wrap items-start" [class]="compact ? 'gap-2' : 'gap-3'">
      @if (showSearch) {
        <ng-container [ngTemplateOutlet]="search" />
      }
      <app-button
        [size]="compact ? 'sm' : 'lg'"
        variant="outline"
        startIconName="lucide:list-filter"
        [ariaExpanded]="open"
        [ariaControls]="panelId"
        (btnClick)="toggle()"
      >
        {{ toggleLabel }}
        @if (activeCount > 0) {
          <app-badge size="sm" variant="solid" color="primary">{{ activeCount }}</app-badge>
        }
      </app-button>
      <ng-container [ngTemplateOutlet]="clearButton" />
    </div>

    @if (open) {
      <div
        [id]="panelId"
        class="mt-4 grid gap-3 border-t border-gray-100 pt-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 dark:border-gray-800"
      >
        @if (showSelect) {
          <ng-container [ngTemplateOutlet]="select" />
        }
        <ng-content></ng-content>
      </div>
    }
  } @else {
    <div class="grid grid-cols-1 md:grid-cols-12" [class]="compact ? 'gap-2' : 'gap-3'">
      @if (showSearch) {
        <div [class]="showSelect ? 'md:col-span-7' : 'md:col-span-10'">
          <ng-container [ngTemplateOutlet]="search" />
        </div>
      }
      @if (showSelect) {
        <div class="md:col-span-3">
          <ng-container [ngTemplateOutlet]="select" />
        </div>
      }
      <div class="md:col-span-2">
        <ng-container [ngTemplateOutlet]="clearButton" />
      </div>
    </div>
  }

  @if (summaryChips.length) {
    <div class="border-t border-gray-100 dark:border-gray-800" [class]="compact ? 'mt-2.5 pt-2.5' : 'mt-3 pt-3'">
      <button
        type="button"
        class="inline-flex cursor-pointer items-center gap-1 rounded-md text-theme-xs font-medium text-gray-500 hover:text-gray-800 focus-visible:outline-2 focus-visible:outline-brand-500 dark:text-gray-400 dark:hover:text-white/90"
        [attr.aria-expanded]="summaryOpen"
        [attr.aria-controls]="summaryPanelId"
        (click)="toggleSummary()"
      >
        <app-icon name="lucide:chevron-down" [iconClass]="'size-3.5 transition-transform ' + (summaryOpen ? '' : '-rotate-90')" />
        {{ summaryOpen ? summaryLabel : 'Mostrar ' + summaryLabel.toLowerCase() }}
      </button>
      @if (summaryOpen) {
        <app-summary-chips
          [id]="summaryPanelId"
          class="mt-2"
          [chips]="summaryChips"
          [ariaLabel]="summaryLabel"
          (chipClick)="summaryChipClick.emit($event)"
        />
      }
    </div>
  }
</div>

<ng-template #search>
  <app-input-field
    icon="lucide:search"
    [compact]="compact"
    [class]="collapsible ? 'basis-full sm:basis-auto' : ''"
    [className]="collapsible ? 'flex-1' : ''"
    [value]="searchValue"
    [placeholder]="searchPlaceholder"
    [ariaLabel]="searchPlaceholder"
    (valueChange)="onSearchChange($event)"
  />
</ng-template>

<ng-template #select>
  <app-form-select
    [compact]="compact"
    [label]="selectLabel"
    [helpText]="selectHelpText"
    [value]="selectValue"
    [placeholder]="selectPlaceholder"
    [options]="selectOptions"
    [showPlaceholder]="selectShowPlaceholder"
    (valueChange)="onSelectChange($event)"
  />
</ng-template>

<ng-template #clearButton>
  <app-button
    [size]="compact ? 'sm' : 'lg'"
    variant="outline"
    startIconName="mdi:filter-remove-outline"
    [class]="collapsible ? '' : 'w-full'"
    [className]="collapsible ? '' : 'w-full'"
    (btnClick)="onClear()"
  >
    {{ clearLabel }}
  </app-button>
</ng-template>
