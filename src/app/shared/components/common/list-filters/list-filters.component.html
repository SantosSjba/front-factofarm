<div class="mb-5 rounded-2xl border border-gray-200 bg-white p-4 dark:border-gray-800 dark:bg-white/[0.03]">
  @if (collapsible) {
    <div class="flex flex-wrap items-start gap-3">
      <ng-container [ngTemplateOutlet]="search" />
      <app-button
        size="lg"
        variant="outline"
        startIconName="lucide:list-filter"
        [ariaExpanded]="open"
        [ariaControls]="panelId"
        (btnClick)="toggle()"
      >
        {{ toggleLabel }}
        @if (activeCount > 0) {
          <app-badge size="sm" variant="solid" color="primary">{{ activeCount }}</app-badge>
        }
      </app-button>
      <ng-container [ngTemplateOutlet]="clearButton" />
    </div>

    @if (open) {
      <div
        [id]="panelId"
        class="mt-4 grid gap-3 border-t border-gray-100 pt-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 dark:border-gray-800"
      >
        @if (showSelect) {
          <ng-container [ngTemplateOutlet]="select" />
        }
        <ng-content></ng-content>
      </div>
    }
  } @else {
    <div class="grid grid-cols-1 gap-3 md:grid-cols-12">
      <div class="md:col-span-7">
        <ng-container [ngTemplateOutlet]="search" />
      </div>
      @if (showSelect) {
        <div class="md:col-span-3">
          <ng-container [ngTemplateOutlet]="select" />
        </div>
      }
      <div class="md:col-span-2">
        <ng-container [ngTemplateOutlet]="clearButton" />
      </div>
    </div>
  }
</div>

<ng-template #search>
  <app-input-field
    icon="lucide:search"
    [class]="collapsible ? 'basis-full sm:basis-auto' : ''"
    [className]="collapsible ? 'flex-1' : ''"
    [value]="searchValue"
    [placeholder]="searchPlaceholder"
    [ariaLabel]="searchPlaceholder"
    (valueChange)="onSearchChange($event)"
  />
</ng-template>

<ng-template #select>
  <app-form-select
    [label]="selectLabel"
    [value]="selectValue"
    [placeholder]="selectPlaceholder"
    [options]="selectOptions"
    [showPlaceholder]="selectShowPlaceholder"
    (valueChange)="onSelectChange($event)"
  />
</ng-template>

<ng-template #clearButton>
  <app-button
    size="lg"
    variant="outline"
    startIconName="mdi:filter-remove-outline"
    [class]="collapsible ? '' : 'w-full'"
    [className]="collapsible ? '' : 'w-full'"
    (btnClick)="onClear()"
  >
    {{ clearLabel }}
  </app-button>
</ng-template>
