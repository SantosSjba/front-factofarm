<div
  class="mb-6 flex flex-wrap items-center justify-between gap-3"
  data-page-toolbar
>
  <div class="min-w-0">
    <ng-content select="[data-toolbar-title]"></ng-content>
  </div>
  <!-- Acciones siempre a la derecha, también cuando bajan a otra fila (teléfono). El contenedor
       `data-toolbar-actions` de cada pantalla suele ser flex: también se alinea a la derecha. -->
  <div class="ms-auto flex max-w-full min-w-0 flex-wrap items-center justify-end gap-2 [&>[data-toolbar-actions]]:justify-end">

    <ng-content select="[data-toolbar-actions]"></ng-content>
    @if (showExcel() && scope(); as s) {
      <app-excel-export-button [scope]="s" [fileName]="fileName()" />
    }
    <!-- Hijos sin atributo de slot se tratan como acciones (evita botones "perdidos"). -->
    <ng-content></ng-content>
  </div>
</div>
