<div
  class="mb-4 flex flex-wrap items-center justify-between gap-3"
  data-page-toolbar
>
  <div class="min-w-0">
    <ng-content select="[data-toolbar-title]"></ng-content>
  </div>
  <div class="flex max-w-full min-w-0 flex-wrap items-center gap-2">
    <ng-content select="[data-toolbar-actions]"></ng-content>
    <!-- Hijos sin atributo de slot se tratan como acciones (evita botones "perdidos"). -->
    <ng-content></ng-content>
  </div>
</div>
