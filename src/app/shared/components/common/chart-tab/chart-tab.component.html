<div class="inline-flex items-center gap-0.5 rounded-lg bg-gray-100 p-0.5 dark:bg-gray-900" role="group" [attr.aria-label]="ariaLabel()">
  @for (opt of options(); track opt.id) {
    <button
      type="button"
      (click)="valueChange.emit(opt.id)"
      class="whitespace-nowrap rounded-md px-2.5 py-1 text-theme-xs font-medium hover:text-gray-900 dark:hover:text-white"
      [ngClass]="buttonClass(opt.id)"
      [attr.aria-pressed]="value() === opt.id"
    >
      {{ opt.label }}
    </button>
  }
</div>
