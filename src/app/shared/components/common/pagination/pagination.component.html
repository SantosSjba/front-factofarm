<div class="flex flex-col items-center justify-between border-t border-gray-200 px-5 py-4 sm:flex-row sm:px-6 dark:border-gray-800">
  <div class="pb-3 sm:pb-0">
    <span class="block text-sm font-medium text-gray-500 dark:text-gray-400">
      Mostrando <span class="text-gray-800 dark:text-white/90">{{ startEntry }}</span> a
      <span class="text-gray-800 dark:text-white/90">{{ endEntry }}</span> de
      <span class="text-gray-800 dark:text-white/90">{{ totalItems }}</span>
    </span>
  </div>

  <div class="flex w-full items-center justify-between gap-1.5 sm:w-auto sm:justify-normal">
    <button
      type="button"
      class="flex size-9 cursor-pointer items-center justify-center rounded-lg border border-gray-300 bg-white text-gray-700 shadow-theme-xs transition hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-50 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-white/5"
      [disabled]="currentPage === 1"
      aria-label="Página anterior"
      (click)="previousPage()"
    >
      <app-icon name="lucide:chevron-left" iconClass="size-4 rtl:rotate-180" />
    </button>

    <span class="block text-sm font-medium text-gray-700 sm:hidden dark:text-gray-400">
      Página {{ currentPage }} de {{ totalPages }}
    </span>

    <ul class="hidden items-center gap-1.5 sm:flex">
      @for (page of visiblePages; track page) {
        <li>
          <button
            type="button"
            (click)="goToPage(page)"
            class="flex size-9 cursor-pointer items-center justify-center rounded-lg border text-sm font-medium transition"
            [attr.aria-label]="'Ir a página ' + page"
            [attr.aria-current]="page === currentPage ? 'page' : null"
            [ngClass]="{
              'border-brand-500 bg-brand-500 text-white shadow-theme-xs dark:border-brand-500 dark:bg-brand-500': page === currentPage,
              'border-gray-300 bg-white text-gray-700 shadow-theme-xs hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-white/5': page !== currentPage
            }"
          >
            {{ page }}
          </button>
        </li>
      }
      @if (visiblePages.length > 0 && visiblePages[visiblePages.length - 1] < totalPages) {
        <li>
          <span class="flex size-9 items-center justify-center text-sm text-gray-500 dark:text-gray-400">...</span>
        </li>
        <li>
          <button
            type="button"
            (click)="goToPage(totalPages)"
            class="flex size-9 cursor-pointer items-center justify-center rounded-lg border border-gray-300 bg-white text-sm font-medium text-gray-700 shadow-theme-xs transition hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-white/5"
            [attr.aria-label]="'Ir a página ' + totalPages"
          >
            {{ totalPages }}
          </button>
        </li>
      }
    </ul>

    <button
      type="button"
      class="flex size-9 cursor-pointer items-center justify-center rounded-lg border border-gray-300 bg-white text-gray-700 shadow-theme-xs transition hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-50 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-white/5"
      [disabled]="currentPage === totalPages"
      aria-label="Página siguiente"
      (click)="nextPage()"
    >
      <app-icon name="lucide:chevron-right" iconClass="size-4 rtl:rotate-180" />
    </button>
  </div>
</div>
