<button
  type="button"
  class="inline-flex items-center justify-center rounded-full text-gray-400 transition hover:text-brand-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-500/40 dark:text-gray-500 dark:hover:text-brand-400"
  [appTooltip]="text"
  appTooltipPlacement="bottom"
  [attr.aria-label]="'Ayuda'"
>
  <app-icon [name]="iconName" [width]="iconSize" [height]="iconSize" />
</button>
