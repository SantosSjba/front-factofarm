<div [class]="hostClass()" [attr.data-compact]="compact() ? '' : null">
  @if (title()) {
    <h3 class="pe-10" [class]="titleClass()" [class.text-lg!]="compact()">{{ title() }}</h3>
  }
  @if (description()) {
    <p class="mt-1 pe-10 text-gray-500 dark:text-gray-400" [class.text-sm]="!compact()" [class.text-theme-xs]="compact()">{{ description() }}</p>
  }
  <div [class.mt-4]="!compact()" [class.mt-2.5]="compact()">
    <app-tab-strip [tabs]="tabs()" [activeId]="activeId()" (tabChange)="selectTab($event)" />
  </div>
</div>
