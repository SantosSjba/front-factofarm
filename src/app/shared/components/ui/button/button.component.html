<button
  [attr.type]="type"
  data-slot="button"
  [appTooltip]="tooltip"
  appTooltipPlacement="top"
  [class]="buttonClasses"
  [class.pointer-events-none]="isDisabled && variant !== 'unstyled'"
  [class.opacity-50]="isDisabled && variant !== 'unstyled'"
  [disabled]="isDisabled"
  [attr.aria-busy]="loading || null"
  [attr.id]="id || null"
  [attr.aria-expanded]="ariaExpanded"
  [attr.aria-controls]="ariaControls || null"
  [attr.aria-label]="tooltip || ariaLabel || null"
  (click)="onClick($event)"
>
  @if (loading) {
    <app-spinner [size]="spinnerSize" label="Procesando" />
  } @else if (startIconName) {
    <app-icon [name]="startIconName" [iconClass]="iconSizeClass" />
  } @else if (startIcon) {
    <span class="inline-flex shrink-0 items-center" [innerHTML]="startIcon | safeHtml"></span>
  }
  @if (!(loading && iconOnly)) {
    <ng-content></ng-content>
  }
  @if (!loading && endIconName) {
    <app-icon [name]="endIconName" [iconClass]="iconSizeClass" />
  } @else if (!loading && endIcon) {
    <span class="inline-flex shrink-0 items-center" [innerHTML]="endIcon | safeHtml"></span>
  }
</button>
