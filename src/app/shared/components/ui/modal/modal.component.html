@if (isOpen) {
<div
  class="modal fixed inset-0 z-99999 flex items-start justify-center overflow-y-auto p-4 sm:items-center sm:py-6"
>
  @if (!isFullscreen) {
  <button type="button" tabindex="-1" aria-label="Cerrar ventana"
    class="fixed inset-0 h-full w-full bg-black/50 backdrop-blur-xs transition-opacity"
    (click)="onBackdropClick()"
  ></button>
  }
  <div
    #dialogPanel
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title || ariaLabel"
    tabindex="-1"
    [attr.data-modal-compact]="compact ? '' : null"
    [ngClass]="panelClasses()"
  >
    @if (showCloseButton && !isFullscreen) {
    <button
      type="button"
      (click)="closed.emit()"
      [class]="compact ? 'end-2 top-2 size-8' : 'end-3 top-3 size-9'"
      class="absolute z-10 flex cursor-pointer items-center justify-center rounded-full text-gray-400 hover:bg-gray-100 hover:text-gray-700 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-white"
      aria-label="Cerrar"
    >
      <svg
        [attr.class]="compact ? 'size-4' : 'size-5'"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <path
          fillRule="evenodd"
          clipRule="evenodd"
          d="M6.04289 16.5413C5.65237 16.9318 5.65237 17.565 6.04289 17.9555C6.43342 18.346 7.06658 18.346 7.45711 17.9555L11.9987 13.4139L16.5408 17.956C16.9313 18.3466 17.5645 18.3466 17.955 17.956C18.3455 17.5655 18.3455 16.9323 17.955 16.5418L13.4129 11.9997L17.955 7.4576C18.3455 7.06707 18.3455 6.43391 17.955 6.04338C17.5645 5.65286 16.9313 5.65286 16.5408 6.04338L11.9987 10.5855L7.45711 6.0439C7.06658 5.65338 6.43342 5.65338 6.04289 6.0439C5.65237 6.43442 5.65237 7.06759 6.04289 7.45811L10.5845 11.9997L6.04289 16.5413Z"
          fill="currentColor"
        />
      </svg>
    </button>
    }

    @if (title) {
    <div
      class="flex shrink-0 flex-col text-start"
      [class]="compact ? 'gap-0.5 px-4 pt-4 pe-11 sm:px-6 sm:pt-5' : 'gap-2 px-6 pt-6 pe-10 sm:px-10 sm:pt-10'"
    >
      <h3 class="font-semibold text-gray-800 dark:text-white/90" [class]="compact ? 'text-lg' : 'text-xl sm:text-2xl'">{{ title }}</h3>
      @if (description) {
      <p class="text-gray-500 dark:text-gray-400" [class]="compact ? 'text-theme-xs' : 'text-sm'">{{ description }}</p>
      }
    </div>
    }
    <ng-content select="[data-modal-header]"></ng-content>

    <div
      class="min-h-0 flex-1 overflow-y-auto overscroll-contain"
      [ngClass]="bodyClass || (title ? (compact ? 'px-4 py-4 sm:px-6 sm:pb-6' : 'px-6 py-5 sm:px-10 sm:pb-10') : null)"
    >
      <ng-content select="[data-modal-body]"></ng-content>
      <ng-content></ng-content>
    </div>

    <ng-content select="[data-modal-footer]"></ng-content>
  </div>
</div>
}
