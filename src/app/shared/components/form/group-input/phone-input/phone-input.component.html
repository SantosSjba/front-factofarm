<div
  [class]="compact ? 'h-9 rounded-lg' : 'h-11 rounded-[10px]'"
  class="group/input-group relative flex w-full min-w-0 items-center overflow-hidden border border-gray-300 bg-white shadow-theme-xs outline-hidden transition-colors focus-within:border-brand-300 focus-within:ring-3 focus-within:ring-brand-500/20 dark:border-gray-700 dark:bg-gray-900 dark:focus-within:border-brand-500/40"
>
  @if (selectPosition === 'start') {
    <div class="relative flex h-full items-center self-stretch border-e border-gray-200 p-0 dark:border-gray-800">
      <ng-container [ngTemplateOutlet]="countrySelect" />
    </div>
  }
  <input
    type="tel"
    [placeholder]="placeholder"
    [class]="compact ? 'py-1.5 ps-3 pe-3' : 'py-2.5 ps-3.5 pe-4'"
    class="h-full min-w-0 flex-1 rounded-none border-0 bg-transparent text-sm font-normal text-gray-800 shadow-none outline-hidden placeholder:text-gray-400 focus:outline-hidden focus:ring-0 dark:bg-transparent dark:text-white/90 dark:placeholder:text-gray-500"
  />
  @if (selectPosition === 'end') {
    <div class="relative flex h-full items-center self-stretch border-s border-gray-200 p-0 dark:border-gray-800">
      <ng-container [ngTemplateOutlet]="countrySelect" />
    </div>
  }
</div>

<ng-template #countrySelect>
  <select
    [value]="selectedCountry"
    (change)="handleCountryChange($event)"
    class="h-full cursor-pointer appearance-none border-0 border-none bg-transparent py-0 ps-3.5 pe-8 text-sm font-medium text-gray-700 shadow-none outline-hidden focus:border-0 focus:border-none focus:outline-hidden focus:ring-0 dark:text-gray-300 dark:hover:text-white dark:focus:text-white"
  >
    @for (country of countries; track $index) {
      <option [value]="country.code" class="text-gray-700 dark:bg-gray-900 dark:text-gray-300">{{ country.code }}</option>
    }
  </select>
  <svg
    class="pointer-events-none absolute end-2.5 size-4 text-gray-500 dark:text-gray-400"
    width="20"
    height="20"
    viewBox="0 0 20 20"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
  >
    <path d="M4.792 7.396L10 12.604l5.208-5.208" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </svg>
</ng-template>
