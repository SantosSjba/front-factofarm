@if (label) {
  <app-label [for]="triggerId || undefined" [required]="required" [helpText]="helpText" [compact]="compact">{{ label }}</app-label>
}
<app-select-field
  [buttonId]="triggerId"
  [ariaLabel]="ariaLabel || (id ? '' : effectivePlaceholder)"
  [value]="value || ''"
  [options]="renderedOptions"
  [placeholder]="effectivePlaceholder"
  [disabled]="disabled"
  [triggerClass]="triggerClass"
  [compact]="compact"
  (valueChange)="valueChange.emit($event)"
/>
@if (hint) {
  <p
    class="text-xs"
    [class.mt-2]="!compact"
    [class.mt-1]="compact"
    [attr.role]="error ? 'alert' : null"
    [ngClass]="error ? 'text-error-500 dark:text-error-400' : 'text-gray-500 dark:text-gray-400'"
  >
    {{ hint }}
  </p>
}
