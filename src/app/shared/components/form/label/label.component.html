<div class="flex items-center gap-1.5" [class.mb-2]="!hasCustomMargin && !compact" [class.mb-1.5]="!hasCustomMargin && compact">
  <label
    data-slot="field-label"
    [attr.for]="for"
    [ngClass]="
      'group/field-label peer/field-label flex w-fit gap-1 ' + (compact ? 'text-theme-xs' : 'text-sm leading-snug') + ' font-medium text-gray-700 select-none group-data-[disabled=true]/field:opacity-50 dark:text-gray-400 ' +
      className
    "
  >
    <span><ng-content></ng-content></span>
    @if (required) {
      <span class="text-error-500 dark:text-error-400" aria-hidden="true">*</span>
      <span class="sr-only">(obligatorio)</span>
    }
  </label>
  @if (helpText) {
    <app-help-hint [text]="helpText" [iconSize]="compact ? 14 : 16" />
  }
</div>
