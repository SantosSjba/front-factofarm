<label
  [attr.for]="for"
  [ngClass]="
    'mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400 ' + className
  "
>
  <ng-content></ng-content>
  @if (required) {
    <span class="ml-0.5 text-error-500" aria-hidden="true">*</span>
    <span class="sr-only">(obligatorio)</span>
  }
</label>
