<div
  role="group"
  data-slot="field"
  data-orientation="vertical"
  [class.gap-2]="!compact" [class.gap-1.5]="compact"
  class="group/field flex w-full flex-col *:w-full [&>.sr-only]:w-auto"
>
  @if (label) {
    <span
      [id]="labelId"
      data-slot="field-label"
      [class]="compact ? 'text-theme-xs' : 'text-sm leading-snug'"
      class="flex w-fit gap-1 font-medium text-gray-700 select-none dark:text-gray-400"
    >
      {{ label }}
      @if (required) {
        <span class="text-error-500 dark:text-error-400" aria-hidden="true">*</span>
      }
    </span>
  }
  <div class="relative w-full" clickOutside [clickOutsideActive]="isOpen" (clickOutside)="isOpen = false">
    <div
      (click)="toggleDropdown()"
      role="combobox"
      [attr.tabindex]="disabled ? -1 : 0"
      [attr.aria-labelledby]="labelId"
      [attr.aria-expanded]="isOpen"
      [attr.aria-controls]="labelId + '-options'"
      [attr.aria-disabled]="disabled"
      (keydown.enter)="onTriggerKey($event)"
      (keydown.space)="onTriggerKey($event)"
      [class]="compact ? 'min-h-9 rounded-lg py-1 ps-2.5 pe-2.5' : 'min-h-11 rounded-[10px] py-1.5 ps-3 pe-3.5'"
      class="group/select-trigger flex w-full min-w-0 items-center justify-between gap-2 border border-gray-300 bg-white text-sm font-normal text-gray-800 shadow-theme-xs outline-hidden transition-all duration-200 select-none hover:border-gray-400 hover:bg-gray-50/50 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/20 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:hover:border-gray-600 dark:hover:bg-gray-800/50 dark:focus:border-brand-500/40"
      [ngClass]="disabled ? 'cursor-not-allowed opacity-50' : 'cursor-pointer'"
    >
      <div class="flex flex-1 flex-wrap items-center" [class.gap-2]="!compact" [class.gap-1]="compact">
        @if (selectedValuesText.length === 0) {
          <span class="text-gray-400 dark:text-gray-500">{{ placeholder }}</span>
        } @else {
          @for (text of selectedValuesText; track $index; let i = $index) {
            <span
              [class]="compact ? 'py-0.5 ps-2 pe-1 text-theme-xs' : 'py-1 ps-2.5 pe-1.5 text-sm'"
              class="inline-flex items-center gap-1.5 rounded-full border border-gray-200 bg-gray-100 font-normal text-gray-800 dark:border-gray-800 dark:bg-white/5 dark:text-white/90"
            >
              <span>{{ text }}</span>
              <button
                type="button"
                [disabled]="disabled"
                [attr.aria-label]="'Quitar ' + text"
                (click)="removeOption(selectedOptions[i]); $event.stopPropagation()"
                class="inline-flex size-3.5 cursor-pointer items-center justify-center rounded-full text-gray-400 transition-colors hover:text-gray-700 dark:text-gray-500 dark:hover:text-gray-300"
              >
                <svg class="size-3" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M18 6L6 18M6 6l12 12" />
                </svg>
              </button>
            </span>
          }
        }
      </div>
      <button
        type="button"
        [disabled]="disabled"
        (click)="toggleDropdown(); $event.stopPropagation()"
        aria-label="Abrir opciones"
        class="inline-flex shrink-0 cursor-pointer items-center justify-center outline-hidden"
      >
        <svg
          class="size-4 shrink-0 text-gray-500 transition-transform duration-200 dark:text-gray-400"
          [class.rotate-180]="isOpen"
          width="20"
          height="20"
          viewBox="0 0 20 20"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path d="M4.792 7.396L10 12.604l5.208-5.208" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </div>
    @if (isOpen) {
      <div
        [id]="labelId + '-options'"
        role="listbox"
        aria-multiselectable="true"
        class="absolute start-0 z-50 mt-1.5 flex max-h-60 w-full flex-col gap-1 overflow-y-auto rounded-2xl border border-gray-200 bg-white p-3 shadow-theme-lg dark:border-gray-800 dark:bg-gray-dark"
      >
        @for (option of options; track $index) {
          <button
            type="button"
            role="option"
            [disabled]="disabled"
            [attr.aria-selected]="selectedOptions.includes(option.value)"
            (click)="handleSelect(option.value)"
            class="flex w-full cursor-pointer items-center justify-between rounded-lg py-2 ps-3 pe-3 text-start text-sm font-medium text-gray-700 transition-colors select-none hover:bg-gray-100 hover:text-gray-900 aria-selected:bg-gray-100 aria-selected:text-gray-900 dark:text-gray-300 dark:hover:bg-white/5 dark:hover:text-white dark:aria-selected:bg-white/5 dark:aria-selected:text-white"
          >
            <span>{{ option.text }}</span>
            @if (selectedOptions.includes(option.value)) {
              <svg class="size-4 text-brand-500 dark:text-brand-400" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20 6L9 17l-5-5" />
              </svg>
            }
          </button>
        }
      </div>
    }
  </div>
</div>
