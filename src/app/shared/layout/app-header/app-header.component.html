<header
  class="relative sticky top-0 z-99999 w-full border-b border-gray-200 bg-white dark:border-gray-800 dark:bg-gray-900"
>
  @if (supportBanner(); as banner) {
    <div
      class="flex items-center justify-between gap-3 border-b border-brand-700/40 bg-brand-950 px-4 py-1.5 text-theme-xs text-white sm:px-6"
    >
      <span class="min-w-0 truncate font-medium tracking-wide">{{ banner }}</span>
      <button
        type="button"
        class="shrink-0 rounded-md border border-white/25 px-2.5 py-1 text-theme-xs font-medium transition hover:bg-white/10"
        (click)="endSupportSession()"
      >
        Salir de soporte
      </button>
    </div>
  }

  <div class="flex items-center gap-3 px-3 py-3 sm:gap-4 sm:px-4 lg:px-6 lg:py-3.5">
    <button
      type="button"
      class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-lg text-gray-500 transition hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-white/5 xl:h-10 xl:w-10 xl:border xl:border-gray-200 dark:xl:border-gray-800"
      [ngClass]="{ 'bg-gray-100 dark:bg-white/[0.03]': isMobileOpen$ | async }"
      (click)="handleToggle()"
      aria-label="Abrir o cerrar menú lateral"
    >
      @if (isMobileOpen$ | async) {
        <app-icon name="lucide:x" width="22" height="22" />
      } @else {
        <app-icon name="lucide:menu" width="18" height="18" />
      }
    </button>

      <a routerLink="/" class="logo-dark-glow inline-flex shrink-0 items-center xl:hidden">
      <img
        [src]="branding.navLogoSrc()"
        [alt]="branding.brandAlt()"
        class="h-8 w-auto max-w-[150px] object-contain"
      />
    </a>

    <div class="hidden min-w-0 flex-1 xl:block">
      <form class="max-w-md 2xl:max-w-lg" (submit)="$event.preventDefault()">
        <div class="relative">
          <span class="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2">
            <app-icon
              name="lucide:search"
              width="18"
              height="18"
              iconClass="text-gray-500 dark:text-gray-400"
            />
          </span>
          <input
            #searchInput
            type="text"
            placeholder="Buscar opción del menú…"
            [value]="searchTerm"
            (focus)="onSearchFocus()"
            (blur)="onSearchBlur()"
            (input)="onSearchInput(($any($event.target).value || '') + '')"
            (keydown.enter)="onSearchEnter()"
            class="h-10 w-full rounded-lg border border-gray-200 bg-transparent py-2 pl-11 pr-16 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-800 dark:bg-white/[0.03] dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
          />
          <span
            class="pointer-events-none absolute right-2.5 top-1/2 inline-flex -translate-y-1/2 items-center gap-0.5 rounded-md border border-gray-200 bg-gray-50 px-1.5 py-0.5 text-[10px] tracking-wide text-gray-500 dark:border-gray-800 dark:bg-white/[0.03] dark:text-gray-400"
          >
            ⌘K
          </span>
          @if (isSearchDropdownOpen) {
            <div
              class="absolute z-[100000] mt-2 max-h-80 w-full overflow-y-auto rounded-xl border border-gray-200 bg-white p-2 shadow-lg dark:border-gray-800 dark:bg-gray-900"
            >
              @if (filteredSearchOptions.length > 0) {
                @for (option of filteredSearchOptions; track option.path) {
                  <button
                    type="button"
                    class="flex w-full items-start justify-between rounded-lg px-3 py-2 text-left hover:bg-gray-100 dark:hover:bg-white/[0.05]"
                    (mousedown)="navigateToOption(option.path)"
                  >
                    <span class="text-sm text-gray-800 dark:text-gray-100">{{ option.name }}</span>
                    <span class="ml-3 text-xs text-gray-500 dark:text-gray-400">{{ option.section }}</span>
                  </button>
                }
              } @else {
                <div class="px-3 py-2 text-sm text-gray-500 dark:text-gray-400">Sin resultados.</div>
              }
            </div>
          }
        </div>
      </form>
    </div>

    <button
      type="button"
      (click)="toggleApplicationMenu()"
      class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-lg text-gray-700 transition hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-800 xl:hidden"
      aria-label="Abrir menú de cuenta"
    >
      <app-icon name="lucide:ellipsis" width="22" height="22" />
    </button>

    <div
      [ngClass]="isApplicationMenuOpen ? 'flex' : 'hidden'"
      class="absolute inset-x-0 top-full z-50 items-center justify-end gap-3 border-b border-gray-200 bg-white px-4 py-3 shadow-theme-md dark:border-gray-800 dark:bg-gray-900 xl:static xl:flex xl:shrink-0 xl:border-0 xl:bg-transparent xl:p-0 xl:shadow-none"
    >
      @if (tenantLabel()) {
        <span
          class="hidden max-w-[10rem] truncate rounded-full border border-brand-200 bg-brand-50 px-2.5 py-1 text-theme-xs font-medium text-brand-800 dark:border-brand-500/30 dark:bg-brand-500/10 dark:text-brand-200 lg:inline"
          [attr.title]="tenantLabel()"
        >
          {{ tenantLabel() }}
        </span>
      }

      <div class="flex items-center gap-1.5 sm:gap-2">
        <app-theme-toggle-button />
        <app-notification-dropdown />
        <app-user-dropdown />
      </div>
    </div>
  </div>
</header>
