<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <title>FactoFarm | Software para farmacias y boticas en Perú</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>
    /* Aplica el tema guardado antes de pintar (evita el parpadeo). La lógica completa está en ThemeService. */
    (function () {
      var s = null;
      try { s = localStorage.getItem('color-scheme') || localStorage.getItem('theme'); } catch (e) {}
      if (s !== 'light' && s !== 'dark') s = null;
      document.querySelector('meta[name="color-scheme"]').content = s || 'light dark';
      if (s === 'dark' || (!s && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <meta name="description" content="Sistema integral para farmacias y boticas en Perú: POS, inventario con lotes, facturación electrónica SUNAT, compras y reportes.">
  <meta name="robots" content="index, follow">
  <meta name="author" content="FactoFarm">
  <meta name="language" content="es-PE">
  <meta name="geo.region" content="PE">
  <meta name="geo.placename" content="Perú">
  <meta property="og:site_name" content="FactoFarm">
  <meta property="og:locale" content="es_PE">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#002840">
  <!-- Fuente Outfit: <link> en vez de @import en el CSS, para no encadenar descargas que bloquean el pintado. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/images/logo/logo-icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/logo/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/logo/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/images/logo/apple-touch-icon.png">
</head>
<body>
  <app-root></app-root>
</body>
</html>
